<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Arena Fut — Teste de acesso</title><style>body{font-family:system-ui;background:#f2f6f3;color:#163e2a;margin:0}main{max-width:520px;margin:50px auto;padding:24px;background:white;border-radius:18px;box-shadow:0 4px 22px #0001}h1{font-size:24px}button{background:#146c43;color:white;border:0;border-radius:9px;padding:14px;font-weight:bold;font-size:16px}p{line-height:1.5}#status{white-space:pre-wrap;background:#eef5f0;padding:15px;border-radius:9px}</style></head><body><main><h1>⚽ Arena Fut Faturas</h1><p>Teste de login e autorização de administrador. Não altera clientes nem faturas.</p><button id="login">Entrar com Google</button> <button id="logout" hidden>Sair</button><p id="status">Aguardando login...</p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyDP93AK9IlOIREyUvsREJtTGPne6XmAAJg',authDomain:'arena-fut-itabira.firebaseapp.com',projectId:'arena-fut-itabira',storageBucket:'arena-fut-itabira.firebasestorage.app',messagingSenderId:'525375761427',appId:'1:525375761427:web:4e7b64750039520d87a3e6',measurementId:'G-PWCKCS85QY'});
const auth=getAuth(app),db=getFirestore(app),status=document.getElementById('status'),login=document.getElementById('login'),logout=document.getElementById('logout');
login.onclick=async()=>{status.textContent='Abrindo login Google...';try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){if(e.code==='auth/popup-blocked'){await signInWithRedirect(auth,new GoogleAuthProvider())}else status.textContent='Falha no login: '+e.code+' — '+e.message}};
logout.onclick=()=>signOut(auth);
getRedirectResult(auth).catch(e=>status.textContent='Erro no redirecionamento: '+e.code);
onAuthStateChanged(auth,async user=>{login.hidden=!!user;logout.hidden=!user;if(!user){status.textContent='Aguardando login...';return}status.textContent='Login confirmado. Verificando autorização...';try{const snap=await getDoc(doc(db,'administradores',user.uid));status.textContent=snap.exists()&&snap.data().Ativo===true?'✅ LOGIN E AUTORIZAÇÃO CONFIRMADOS\nUID: '+user.uid+'\nPerfil: '+(snap.data().perfil||'administrador'):'⚠️ Login confirmado, mas usuário não autorizado.\nUID: '+user.uid+'\nVerifique o documento administradores/{UID} e o campo Ativo.'}catch(e){status.textContent='⚠️ Login confirmado, mas consulta ao Firestore falhou: '+e.code+' — '+e.message}});
</script></body></html>
